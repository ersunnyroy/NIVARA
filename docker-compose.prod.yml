# Production overrides:  docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d
# Requires a .env with strong SECRET_KEY / ENCRYPTION_KEY / POSTGRES_PASSWORD (see .env.example).
services:
  db:
    ports: []            # not exposed on the host
    restart: unless-stopped
  redis:
    ports: []
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
  backend:
    ports: []
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      LOG_JSON: "true"
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips '*'"]
  worker:
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
  beat:
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
  frontend:
    ports: []
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    profiles: ["app"]
    depends_on: [frontend, backend]
    ports: ["80:80"]  # add "443:443" plus a `listen 443 ssl` server block once certificates are configured
    volumes:
      - ./deploy/nginx/nivara.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy_params_nivara:/etc/nginx/proxy_params_nivara:ro
    restart: unless-stopped
