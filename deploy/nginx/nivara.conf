# Reverse proxy: / → Next.js, /api → FastAPI. Terminate TLS here (or at your load balancer).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

upstream nivara_frontend { server frontend:3000; keepalive 16; }
upstream nivara_backend  { server backend:8000;  keepalive 16; }

server {
    listen 80;
    server_name _;
    # In production redirect to HTTPS and add a `listen 443 ssl` block with your certificates:
    # return 301 https://$host$request_uri;

    client_max_body_size 5m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # HTTPS only

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://nivara_backend;
        include /etc/nginx/proxy_params_nivara;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://nivara_backend;
        proxy_read_timeout 120s;
        include /etc/nginx/proxy_params_nivara;
    }
    location / {
        proxy_pass http://nivara_frontend;
        include /etc/nginx/proxy_params_nivara;
    }
}
